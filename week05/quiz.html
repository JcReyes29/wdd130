<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>

    </header>
    <main>
        <form action="#">
            <h1>Basic HTML and CSS Quiz</h1>

            <label class="question-number" for="q1">1. <span>What does the acronym CSS stand
                    for?</span></label>
            <input type="text" name="q1" id="q1">

            <label class="question-number" for="q2">2. <span>How are id and class attributes
                    selected in CSS</span></label>
            <textarea name="q2" id="q2"></textarea>

            <label class="question-number" for="q3">3. <span>Which of the following is a valid
                    CSS comment?</span></label>
            <select name="q3" id="q3">
                <option value="" disabled selected>Choose One...</option>
                <option value="1">/* Valid CSS Comment*/</option>
                <option value="2">-- Valid CSS Comment --&gt;</option>
                <option value="3">| Comment |</option>
            </select>

            <label class="" for="q4">4. <span>What is the bottom margin given
                    this declaration?</span>
                <code>margin 10px 5px 15px;</code>
            </label>
            <input type="number" name="q4" id="q4">

            <button type="submit">Submit Quiz</button>
        </form>

    </main>
    <footer>

    </footer>

</body>

</html>
