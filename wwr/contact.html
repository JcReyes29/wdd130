<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="The purpose of thi section is provide all the contact information for every posible customer.">
    <meta name="author" content="Juan Carlos Reyes Pacheco">
    <title>Contact Us Rafting Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo_proyect.svg" alt="rafting site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="title">
            <h1>Rafting Adventures</h1>
            <p>Santiago Cardenas 275</p>
            <p>Lima, Peru</p>
            <p>52 932 780 159</p>
            <p>adventures@gmail.com</p>
        </div>
        <div class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d472942.09654052474!2d-76.43178844034543!3d-13.023230875192695!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x910fe7a6d1a68def%3A0x50bddb1dbee9225d!2sLunahuan%C3%A1!5e1!3m2!1ses!2spe!4v1791416588440!5m2!1ses!2spe"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="form-contact" action="#">

                <div class="square first-name">
                    <label for="name">Name</label>
                    <input type="text" required placeholder="Juan Carlos" id="name" name="name">
                </div>
                <div class="square addres">
                    <label for="email">Email</label>
                    <input type="text" required placeholder="j.creyesp29@gmail.com" id="email"
                      name="email">
                </div>

                <div class="square container-option">
                    <p>Message Purpose</p>
                    <div class="square options">
                        <input type="radio" id="o1" name="o1">
                        <label for="o1">General Inquiry</label>
                        <input type="radio" id="o2" name="o2">
                        <label for="o2">Reservation Question</label>
                        <input type="radio" id="o3" name="o3">
                        <label for="o3">Website Suggestion</label>
                    </div>

                </div>
                <div class="square container-message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                </div>

                <div class="subscribe">
                    <input type="checkbox" name="subscribe" id="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthyly newsletter</label>
                </div>


                <div class="button">
                    <button type="submit">Get in Touch!</button>
                </div>


            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="single">
                <figure>
                    <img src="images/employee1.jpg" alt="river photo">
                    <figcaption>Whitewater Raft Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="people in the boat">
                    <figcaption>Guest Services</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="lake in the middle of the forest">
                    <figcaption>CDL River Shuttle Driver</figcaption>
                </figure>
            </div>


        </section>
    </main>
    <footer>
        <div>
            <p>&copy;2026 | Rafting Adventures | Juan Carlos Reyes</p>
        </div>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebooklogo.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedinlogo.svg" alt="Linkedin Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/logoinstagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
